project:
  title: "SliceEq: Acquisition-Equivariant Fractional Occupancy for Semi-Supervised MRI Segmentation"
  question: "Can a shared non-invertible slice-profile operator re-acquire neighboring MR signal and exact/teacher-derived tissue occupancy together, correcting the label-invariance failure of conventional strong augmentation while preserving single-slice 2D inference?"
  status: active
  started: "2026-08-10"
  domain: "semi-supervised medical image segmentation"

