  open_problems:
    - "Existing adaptive augmentation usually conflates pseudo-label confidence, augmentation validity, and training difficulty."
    - "Cross-patient mixing can create artificial boundaries and anatomically implausible contexts."
    - "Strong augmentation is useful only in a narrow region: too weak gives zero gradient; too strong changes or obscures the target."
    - "Weak-to-strong SSL keeps pseudo-label certainty fixed even when blur, noise, downsampling, or erasing reduces the evidence available to the student."
    - "PROMISE12 evaluations are often vulnerable to patient leakage, unstable label subsets, and single-dataset claims."
    - "Existing augmentation is usually defined in Cartesian image coordinates rather than in object-relative normal/tangential boundary coordinates."
    - "It is unknown whether the unlabeled set expands boundary-evidence support beyond the small labeled subset, or whether a simple local contrast jitter is sufficient."
    - "Weak-to-strong methods sample augmentation marginals, but rarely test whether a balanced transformation-space design reduces finite-sample orbit drift under hard pseudo-labels."
    - "Slice-wise SSL treats each reconstructed MRI slice as a zero-thickness 2D image even though a 2D multi-slice acquisition integrates anatomy through a slice-profile PSF before sampling."
    - "Most augmentation assumes label invariance or geometric equivariance; acquisition changes instead require the image and tissue occupancy target to pass through the same forward operator."
  evidence_gaps:
    - "No experimental evidence yet that teacher transformation stability predicts true augmentation-induced pseudo-label error on PROMISE12."
    - "No experimental evidence yet that realistic degradation produces target over-certainty or that spatially coupled pseudo-target entropy improves PROMISE12 segmentation."
    - "The baseline code is audited, but the copied folder contains no PROMISE12 list files, checkpoints, baseline logs, or performance.txt; numerical reproduction must occur in the Linux data environment."
    - "One external CoDA log/performance pair reports test Dice 0.819876, but has no paired baseline artifact, checkpoint hash, exact command/seed record, or TensorBoard mechanism traces; it remains exploratory rather than confirmatory evidence."
    - "No oracle intervention yet shows that a full boundary-normal profile has an ordered causal effect beyond matched scalar contrast or blur."
    - "No evidence yet shows that profiles extracted from teacher LCC masks preserve GT-derived profile ordering."
    - "No evidence yet shows that antithetic transformation pairs produce negatively correlated prediction displacements or outperform two IID views at matched compute."
    - "No experiment yet shows that paired slice-profile re-acquisition improves the locked baseline or UniMatch while preserving image-target agreement at prostate apex/base slices."

hypotheses:
  - id: H1
    statement: "Among candidate strong views, selecting the view with maximum student difficulty subject to low teacher transformation inconsistency improves Dice and HD95 over random strong augmentation."
    status: pending
    motivation: "Separates semantic validity from optimization utility instead of treating confidence as both."
    parent: null
    priority: medium
  - id: H1.1
    statement: "Teacher transformation inconsistency is positively correlated with oracle pseudo-label error measured on held-out labeled volumes."
    status: pending
    motivation: "This is the mechanistic premise of H1 and must be validated before full training."
    parent: H1
    priority: high
  - id: H2
    statement: "An MRI-physics augmentation bank improves cross-center robustness more than a generic color/blur bank when used with the same validity-informativeness selector."
    status: pending
    motivation: "PROMISE12 contains multi-center, multi-vendor, multi-protocol appearance variation."
    parent: H1
    priority: medium
  - id: H3
    statement: "A carefully tuned fixed weak-to-strong Mean Teacher closes most of the gain attributed to complex medical SSL methods."
    status: pending
    motivation: "Mandatory simplicity test and guard against a weak baseline."
    parent: null
    priority: high
  - id: H4
    statement: "Within the locked baseline and split, coupling dense pseudo-target entropy to the local evidence loss produced by the sampled strong augmentation improves Dice/HD95 and calibration over hard, fixed-soft, and image-aware-static soft targets."
    status: exploratory_positive_mechanism_unresolved
    motivation: "Standard weak-to-strong consistency transforms the image but treats target certainty as invariant, even for information-destroying transformations."
    parent: null
    priority: high
  - id: H4.1
    statement: "As corruption severity increases, hard-target Mean Teacher becomes increasingly overconfident and eventually exhibits negative transfer relative to a severity-coupled soft target."
    status: unverified
    motivation: "This failure curve is the required empirical observation behind a BCP-level story."
    parent: H4
    priority: high
  - id: H5
    statement: "Resynthesizing unlabeled boundary-manifold evidence on labeled recipient anatomy with unchanged hard GT improves boundary and region metrics over the locked baseline and severity-matched global/local augmentation controls."
    status: rejected_by_user_and_negative_evidence
    motivation: "The small labeled subset may under-sample real interface contrast, transition width, partial-volume pattern, and adjacent-tissue texture even when global image appearance is covered."
    parent: null
    priority: high
  - id: H5.1
    statement: "A full two-sided boundary-normal evidence intervention produces an ordered, band-localized prediction response that cannot be reproduced by matched scalar contrast or blur."
    status: archived_without_further_action
    motivation: "This is the mandatory mechanism and novelty gate before any BMER training run."
    parent: H5
    priority: highest
  - id: H5.2
    statement: "Teacher-LCC-derived unlabeled evidence profiles preserve the ordering and shape of GT-derived profiles sufficiently to estimate an augmentation distribution."
    status: archived_without_further_action
    motivation: "Without measurement fidelity, the unlabeled profile bank is another confirmation-bias channel."
    parent: H5
    priority: highest
  - id: H6
    statement: "On pseudo-labeled unlabeled images, antithetic transformation pairs improve segmentation over two IID same-cost views by canceling odd-order augmentation-orbit drift."
    status: closed_without_rescue_after_full_run_and_strong_comparator
    motivation: "OBA tests at 0.818872, is mean-neutral versus CoDA, deteriorates persistently after its 13.8k validation peak, and is below the user-reported UniMatch result of about 0.83. Shared pretraining remains necessary for fair attribution but is no longer sufficient reason to spend another full run on H6."
    parent: null
    priority: highest
  - id: H6.1
    statement: "At matched marginal severity, +a/-a views have negatively correlated signed prediction displacement and smaller mean drift than two IID views on held-out labeled cases."
    status: not_run_no_longer_decision_critical
    motivation: "This is the necessary observable behind OBA's local odd-order cancellation claim."
    parent: H6
    priority: archived
  - id: H7
    statement: "Applying the same stochastic MRI slice-profile re-acquisition operator to neighboring image signal and exact/teacher-derived tissue occupancy improves slice-wise semi-supervised segmentation over target-invariant augmentation without changing the inference network."
    status: primary_direction_selected_causal_attribution_controls_pending
    motivation: "CoDA and OBA perturb observations while retaining a target formed on a different evidence distribution. SliceEq instead models a physically grounded observation change and transforms tissue occupancy with the identical operator, exploiting adjacent-slice anatomy that the locked 2D baseline currently discards."
    parent: null
    priority: highest
  - id: H7.1
    statement: "Within a preregistered slice-profile range, joint image-target re-acquisition preserves central-slice anatomy substantially better than image-only slab averaging and yields target changes concentrated at physically plausible partial-volume boundaries."
    status: unverified_tensorboard_activity_trace_not_supplied
    motivation: "This is the minimum validity gate; failure means the operator is merely mislabeled blur and H7 must be rejected before a full run."
    parent: H7
    priority: highest
  - id: H7.2
    statement: "Preserving slice-profile-weighted fractional tissue occupancy and anchoring it with an exact-GT re-acquired labeled view improves median-case and acquisition-stratified boundary performance over hard-argmax SliceEq."
    status: selected_primary_method_user_confirmed_development_dice_0_844566
    motivation: "The locked development comparison is SliceEq about 0.832603 to SliceEqOcc about 0.844566, an absolute gain of 0.011963. The v1 center coefficient is below one half over only about 3.5% of sampled profile space, so hard argmax likely discards most paired-target information; fractional occupancy activates the intended forward-model supervision without CoDA-style uniform background contamination."
    parent: H7
    priority: highest
  - id: H7.3
    statement: "Normalizing the re-acquired segmentation risk over the acquisition-induced fractional-occupancy residual prevents the physically informative interface signal from being diluted by consensus background and interior pixels."
    status: rejected_by_preregistered_gate1_residual_gradient_already_dominant
    motivation: "Only about 0.82-0.88% of pixels are fractional and mean occupancy deviation is about 0.0016-0.0018, while the current CE/Dice objectives aggregate over the full image."
    parent: H7
    priority: closed
  - id: H7.4
    statement: "Commuting the sampled slice-profile operator with a topology-preserving teacher posterior yields more faithful local fractional occupancy than applying it after hard/LCC pseudo segmentation."
    status: rejected_by_preregistered_fidelity_gate
    motivation: "H7.3 Gate 2 shows high residual support overlap and sample-mass correlation but only 0.3485 pixelwise magnitude correlation; Gate 1 rules out insufficient boundary gradient as the bottleneck."
    parent: H7
    priority: closed
  - id: H7.5
    statement: "Replacing independent per-sample profile draws with batch-stratified low-order quadrature over the unchanged physical profile distribution reduces acquisition-gradient estimation variance without changing batch size, target representation, loss, network, or inference graph."
    status: rejected_no_material_gain_user_confirmed
    motivation: "The completed SliceEqSAQ trial produced no material gain. Mechanistically, its four nodes are balanced across different anatomy samples rather than within the same conditional risk; they preserve mean center weight (about 0.625) but truncate the IID center-weight range from about 0.485--0.855 to only 0.532/0.718. Sampling variance is therefore not retained as the primary bottleneck."
    parent: H7
    priority: closed
  - id: H7.6
    statement: "Conditioning paired slice-profile re-acquisition on trustworthy acquisition geometry in physical coordinates and sharing one coherent virtual protocol across a scan improves robustness to through-plane protocol shift over fixed slice-unit, per-sample IID SliceEqOcc."
    status: split_into_h7_6a_implemented_and_physical_stage_deferred
    motivation: "The current sigma/phase range is defined in slice units and sampled independently for each training sample, whereas physical support varies with acquisition geometry and a real scanner protocol is volume-level. This extension strengthens the acquisition motivation without changing the paired occupancy mechanism or inference graph."
    parent: H7
    priority: high_after_attribution
  - id: H7.6a
    statement: "Sharing one continuously sampled virtual slice profile across every slice of a case within an epoch, while preserving cross-case stratified and cross-epoch continuous coverage, improves SliceEqOcc over independent per-slice profiles."
    status: rejected_external_run_test_dice_0_836219
    motivation: "The current H5/list contract exposes reliable case identity but no verified spacing or thickness. H7.6a therefore tests the scan-level correlation structure without pretending to perform physical calibration. Randomized stratification preserves the original sigma/phase ranges and tails, avoiding SliceEqSAQ's fixed-node truncation."
    parent: H7.6
    priority: closed
  - id: H7.11
    statement: "Two train-mode teacher occupancies projected by the same SliceEq profile can use operator-space dropout disagreement to suppress reducible pseudo-target instability without suppressing agreed fractional occupancy."
    status: rejected_external_run_neutral_to_parent
    motivation: "The labeled-only H7.10 screen found that post-operator JS ranked exact occupancy error, but the full intervention must be nontrivial and improve the locked parent validation trajectory to justify a reliability component."
    parent: H7.2
    priority: closed
  - id: H7.12
    statement: "Forming one 26-connected hard pseudo occupancy over each three-slice unlabeled slab before the existing SliceEq measurement improves acquisition-target coherence over independent per-slice 2-D component filtering."
    status: rejected_external_run_neutral_to_parent
    motivation: "The current target construction assumes the three retained masks describe one latent anatomical source slab, yet independent 2-D LCC can retain disconnected structures on adjacent slices. This error is systematic and therefore invisible to the near-identity ADU disagreement weighting."
    parent: H7.2
    priority: closed
  - id: H7.13
    statement: "Composing a coordinate-preserving monotonic appearance perturbation after paired through-plane re-acquisition improves weak-to-strong consistency while preserving the acquisition-derived fractional occupancy target."
    status: validation_proxy_positive_test_selected_oracle_unbiased_confirmation_pending
    motivation: "Recent pseudo-topology and stochastic-reliability successors were near-identity interventions. H7.13 acts on every post-warmup unlabeled re-acquired student view while retaining the full SliceEqOcc target, batch, loss, teacher, validation, and inference contracts."
    parent: H7.2
    priority: highest
  - id: H7.19
    statement: "A global phase-symmetric profile distribution designed from labeled-training exact occupancy can improve worst patient/index-stratum retained fractional information while matching the parent profile moments and image perturbation budget."
    status: positive_user_selected_highest_checkpoint_final_method
    motivation: "ARCP showed that per-stack image-response equalization is the wrong objective, while bin integration, wider support and nonlinear fusion introduce severity, teacher-BN or target-pairing confounds. H7.19 is the final bounded test of whether the parent profile distribution, rather than its linear operator, can be improved without validation/test or model feedback."
    parent: H7.2
    priority: selected_final_method
  - id: H7.20
    statement: "Replacing post-warmup slice-uniform stream sampling with one frozen patient-balanced axial-support distribution designed from exact labeled fractional-occupancy opportunity improves the final MPD acquisition risk without changing the model or objective."
    status: implemented_awaiting_external_full_run
    motivation: "MPD robustly designs which through-plane operators are sampled, but the parent TwoStream sampler still weights patients in proportion to slice count and can let dense axial regions dominate SGD. H7.20 aligns the data-support distribution with the same paired acquisition risk while avoiding prediction/loss/uncertainty-driven hard mining."
    parent: H7.19
    priority: next_single_run

