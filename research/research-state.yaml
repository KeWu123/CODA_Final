primary_direction:
  id: SliceEqOccOAACStrongMPD
  public_name: "SliceEqOcc-OAAC-MPD"
  name: "Robust Moment-Profiled Acquisition-Aligned Fractional Occupancy with Ordered Appearance Consistency"
  core: "Use labeled-training exact occupancy to design one global phase-symmetric distribution over the three-slice Gaussian profile domain under moment, image-residual, density and entropy constraints. Sample this frozen distribution and apply each profile identically to neighboring MR images and exact/teacher masks to form fractional occupancy, then apply coordinate-preserving OAAC only to the re-acquired U student image."
  baseline_change: "Relative to OAAC-Strong, MPD replaces only the profile sampler with the frozen designed q. Network, Pre10000 state, student36 batch, EMA train mode, losses/ramp, OAAC scale1.25, optimizer/LR, validation, checkpoint cadence and single-slice inference remain unchanged."
  status: "FINAL SELECTED METHOD BY USER-DEFINED HIGHEST-CHECKPOINT POLICY: SliceEqOcc-OAAC-Strong-MPD iter29000, PROMISE12 development Dice0.854573. The checkpoint is explicitly selected by observed test performance rather than validation-best; MM-WHS evaluation remains pending."
  locked_development_delta: "descriptive trajectory: baseline0.78-0.80 -> SliceEq0.832603 -> SliceEqOcc0.844566 -> OAAC-Strong0.851960 -> OAAC-Strong-MPD0.854573"
  next_method_hypothesis: "Run the isolated H7.20 PARS successor once. It preserves the exact parent sampler for iter0--999, then replaces only slice-entry draws with patient-uniform cycling and one exact-L-designed frozen axial-third law shared by L/U. Do not combine OAAC joint-distribution or endpoint changes in this run."
  working_title: "SliceEqOcc-OAAC-MPD: Robust Moment-Profiled Fractional Occupancy for Semi-Supervised MRI Segmentation"

